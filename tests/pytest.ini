[pytest]
testpaths = .
addopts = -ra --strict-markers --timeout=600
timeout_func_only = true
markers =
    smoke: one of every binary and path, about six minutes with the install
    slow: takes minutes on its own (the level probes, the whole still set, the shape change on screen)
    reboot: the test or its module reboots the Amiga (C:Reboot); deselected by --no-reboot
    hooks: needs vchiq.device built with EMU68_VCHIQ_TEST_HOOKS; skipped otherwise
    profile: needs the profile tier of this component in the installed build; skipped otherwise
    listen: someone at the machine records what they hear; selected only with --listen
    hands: needs the user's hands (an external reset); selected only with --hands
